[project]
name = "memdiff"
version = "0.1.0"
description = "Provenance- and belief-revision-aware agent memory engine with interactive Memory Time Machine debugger."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dishka>=1.10,<1.11",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "openai>=1.65.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
memdiff-fetch = "memdiff.presentation.cli.fetch_lmev2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
